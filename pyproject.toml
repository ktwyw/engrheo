[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engrheo"
version = "0.1.0"
description = "Rheology for engineers: validated Python for flow curves, rheometer corrections, viscoelasticity, thixotropy, extensional and non-Newtonian flow, with an 18-notebook course."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yanwei Wang", email = "wangyanwei@gmail.com" }]
keywords = ["rheology", "non-Newtonian", "viscosity", "viscoelasticity", "rheometer", "yield stress",
            "Herschel-Bulkley", "Carreau", "pipe flow", "polymer", "LAOS", "thixotropy", "time-temperature superposition",
            "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.7", "pandas>=1.5", "jupyterlab>=4"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7", "pandas>=1.5", "nbformat>=5", "nbclient>=0.9", "ipykernel>=6"]

[project.urls]
Homepage = "https://github.com/ktwyw/engrheo"
Issues = "https://github.com/ktwyw/engrheo/issues"
Validation = "https://github.com/ktwyw/engrheo/blob/main/docs/VALIDATION.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engrheo = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/engrheo"]
addopts = "--doctest-modules"
filterwarnings = ["error::FutureWarning", "error::DeprecationWarning:engrheo.*"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks/*.ipynb", "solutions/*.ipynb"]  # generated by the build scripts
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "E402", "B905"]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["E501"]
"notebooks/*.py" = ["E501", "E702"]  # notebook code favours compact plotting lines
"solutions/*.py" = ["E501", "E702"]
"tests/*" = ["E501"]
"tools/*" = ["E501"]
"src/engrheo/datasets.py" = ["E501"]  # data descriptions
